[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpe-coach"
version = "2.1.0"
description = "CPE 自學教練：126 週課程、107 題原創練習、本地判題、網頁介面（選取文字問 AI）"
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
cpe = "cpe_coach.cli:main"

[tool.setuptools]
packages = ["cpe_coach"]

[tool.setuptools.package-data]
cpe_coach = ["data/*.json", "data/*.md", "static/*.html", "static/*.svg", "static/css/*.css", "static/js/*.js", "data/drills/index.json", "data/drills/*/statement.md", "data/drills/*/tests/*"]
